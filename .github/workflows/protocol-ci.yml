name: Protocol CI

on:
  pull_request:
  push:

jobs:
  protocol-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip

      - run: python -m pip install -e ".[dev]"

      - run: python scripts/check_namespace.py

      - run: python scripts/check_clsp_hex_drift.py

      - run: python -m pytest tests/test_compile.py tests/test_puzzle_integrity.py -q

      - run: python -m pytest -q
