name: Protocol CI

on:
  pull_request:
  push:

jobs:
  protocol-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: protocol
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/protocol/build-constraints.lock
      PYTHONPATH: ${{ github.workspace }}/solslot-api
    steps:
      - uses: actions/checkout@v4
        with:
          path: protocol
          persist-credentials: false

      # The inventory activation test compares the generated protocol fixture
      # with the exact portal candidate that consumes it.
      - uses: actions/checkout@v4
        with:
          repository: MattHintz/solslot-portal
          ref: 58b6aae0f4df61b45e37d8c0ce53a206a7f3382d
          path: admin-portal
          persist-credentials: false

      # Native generation integration tests import the matching API, rather
      # than skipping reconstruction and durable-dispatch coverage in CI.
      - uses: actions/checkout@v4
        with:
          repository: MattHintz/solslot-api
          ref: 6f49e5f95a8b95b65569741560b066824b1c15d7
          path: solslot-api
          persist-credentials: false

      - name: Expose the canonical portal sibling for schema checks
        run: ln -s admin-portal ../solslot-portal

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: protocol/requirements-test.lock

      - name: Install hash-locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip install --no-deps -e . -e ../solslot-api
          python -m pip check

      - run: python scripts/check_namespace.py

      - run: python scripts/check_clsp_hex_drift.py

      - name: Check portable identity amendment fixtures
        run: >-
          python -m pytest tests/test_identity_deployment_amendment.py
          tests/test_identity_network_amendment.py -q

      - run: python -m pytest tests/test_compile.py tests/test_puzzle_integrity.py -q

      - run: python -m pytest -q

      - name: Audit release dependencies
        run: >-
          pip-audit --require-hashes -r requirements-test.lock

      - name: Audit build dependencies
        run: pip-audit -r build-constraints.lock
